name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The write path used to publish this build carries text only, so the
      # binary assets (fonts, icons) travel as base64 and the 470 kB timing
      # pack travels in chunks. Both are stitched back together here, which
      # makes the published site byte-for-byte the same build.
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          find . -maxdepth 1 -mindepth 1 \
            ! -name '.git' ! -name '.github' ! -name '.b64' ! -name 'site' \
            -exec cp -r {} site/ \;
          rm -rf site/data/parts
          cat data/parts/timings.* > site/data/timings.js
          rm -rf data/parts
          while IFS= read -r f; do
            rel="${f#./}"; rel="${rel%.b64}"
            mkdir -p "site/$(dirname "$rel")"
            base64 -d "$f" > "site/$rel"
          done < <(find .b64 -name '*.b64')
          echo "--- the published site ---"
          find site -type f | sort
          du -sh site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
